query SetSnapshotDetail($setId: ID!) {
  set(id: $setId) {
    id
    fullRoundText
    round
    phaseGroup {
      displayIdentifier
      phase {
        name
      }
    }
    state
    winnerId
    slots {
      seed {
        id
        seedNum
      }
      entrant {
        id
        name
      }
      standing {
        stats {
          score {
            value
          }
        }
      }
    }
  }
}
