query TournamentSync($slug: String!, $perPage: Int!) {
  tournament(slug: $slug) {
    id
    name
    slug
    events {
      id
      name
      phaseGroups {
        id
        bracketType
        displayIdentifier
        phase {
          id
          name
          phaseOrder
        }
      }
      sets(page: 1, perPage: $perPage, sortType: STANDARD) {
        nodes {
          id
          identifier
          fullRoundText
          round
          phaseGroup {
            displayIdentifier
            phase {
              name
              phaseOrder
            }
          }
          state
          winnerId
          entrant1Source {
            type
            typeId
            condition
            conditionString
          }
          entrant2Source {
            type
            typeId
            condition
            conditionString
          }
          winnerProgressionSeed {
            id
            seedNum
          }
          loserProgressionSeed {
            id
            seedNum
          }
          slots {
            seed {
              id
              seedNum
            }
            entrant {
              id
              name
            }
            standing {
              stats {
                score {
                  value
                }
              }
            }
          }
        }
      }
    }
  }
}
